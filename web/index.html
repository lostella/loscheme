<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <meta name="color-scheme" content="light dark" />
        <title>loscheme</title>
        <style>
            :root {
                --bg: #f6f7f9;
                --panel: #ffffff;
                --border: #d8dce2;
                --text: #1b1f24;
                --muted: #667085;
                --accent: #2563eb;
                --accent-text: #ffffff;
                --error: #c62828;
                --value: #1b7f4b;
                --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo,
                    Consolas, monospace;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #14161a;
                    --panel: #1c1f25;
                    --border: #343943;
                    --text: #e6e8ec;
                    --muted: #959db0;
                    --accent: #6ea8fe;
                    --accent-text: #14161a;
                    --error: #ff7b72;
                    --value: #5fd38d;
                }
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                display: flex;
                justify-content: center;
            }
            main {
                width: 100%;
                max-width: 860px;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding: 16px max(16px, env(safe-area-inset-right))
                    max(16px, env(safe-area-inset-bottom))
                    max(16px, env(safe-area-inset-left));
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            h1 {
                margin: 0;
                font-size: 1.35rem;
                letter-spacing: -0.01em;
            }
            h1 span {
                color: var(--accent);
            }
            header a {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                color: var(--muted);
                text-decoration: none;
                font-size: 0.9rem;
            }
            header a:hover {
                color: var(--text);
            }
            header svg {
                width: 1.25em;
                height: 1.25em;
                fill: currentColor;
            }
            .toolbar {
                display: flex;
                gap: 8px;
            }
            select,
            button {
                font: inherit;
                font-size: 1rem;
                min-height: 44px;
                border-radius: 8px;
                border: 1px solid var(--border);
                color: var(--text);
                background: var(--panel);
            }
            select {
                flex: 1;
                min-width: 0;
                padding: 0 10px;
            }
            button {
                padding: 0 22px;
                cursor: pointer;
                font-weight: 600;
            }
            #run {
                background: var(--accent);
                border-color: var(--accent);
                color: var(--accent-text);
            }
            #run.stop {
                background: var(--error);
                border-color: var(--error);
            }
            #run:disabled {
                opacity: 0.5;
                cursor: default;
            }
            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
            .pane {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 10px;
                font-family: var(--mono);
                font-size: 0.95rem;
                line-height: 1.5;
                tab-size: 2;
                margin: 0;
                padding: 12px;
                width: 100%;
            }
            #editor {
                flex: 3 1 0;
                min-height: 120px;
                resize: none;
                color: var(--text);
                /* 16px+ stops iOS from zooming in when the editor is focused */
                font-size: max(16px, 0.95rem);
            }
            #output-wrap {
                flex: 2 1 0;
                min-height: 90px;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                padding: 0;
            }
            #output-wrap header {
                padding: 8px 12px;
                border-bottom: 1px solid var(--border);
                font-family: system-ui, sans-serif;
                font-size: 0.8rem;
                color: var(--muted);
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }
            #output {
                flex: 1;
                margin: 0;
                padding: 12px;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-word;
            }
            #output .value {
                color: var(--value);
            }
            #output .error {
                color: var(--error);
            }
            #output .hint {
                color: var(--muted);
            }
            #status {
                text-transform: none;
                letter-spacing: 0;
            }
            kbd {
                font-family: var(--mono);
                font-size: 0.85em;
            }
            @media (max-width: 480px) {
                main {
                    gap: 10px;
                    padding-top: 12px;
                }
                button {
                    padding: 0 18px;
                }
                .shortcut {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <h1 aria-label="loscheme"><span aria-hidden="true">λ</span>oscheme</h1>
                <a
                    href="https://github.com/lostella/loscheme"
                    target="_blank"
                    rel="noopener"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.68 7.68 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.49 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38C13.71 14.53 16 11.54 16 8c0-4.42-3.58-8-8-8z"
                        ></path>
                    </svg>
                    Source
                </a>
            </header>

            <div class="toolbar">
                <select id="examples" aria-label="Load an example program">
                    <option value="">Examples…</option>
                </select>
                <button id="run" disabled>▶ Run</button>
            </div>

            <textarea
                id="editor"
                class="pane"
                aria-label="Scheme code"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                placeholder="Write some Scheme, e.g. (+ 1 2)"
            >
(import (scheme write))

(define (greet name)
  (display "Hello, ")
  (display name)
  (newline))

(greet "world")
(map (lambda (x) (* x x)) '(1 2 3 4 5))</textarea
            >

            <section id="output-wrap" class="pane" aria-label="Output">
                <header>
                    <span>Output</span>
                    <span id="status"
                        ><span class="shortcut"
                            ><kbd id="shortcut">Ctrl</kbd>+<kbd>Enter</kbd> to
                            run</span
                        ></span
                    >
                </header>
                <pre id="output" aria-live="polite"></pre>
            </section>
        </main>

        <script type="module">
            const editor = document.getElementById("editor");
            const output = document.getElementById("output");
            const runButton = document.getElementById("run");
            const examples = document.getElementById("examples");
            const status = document.getElementById("status");

            const isMac = /mac|iphone|ipad/i.test(navigator.platform);
            document.getElementById("shortcut").textContent = isMac
                ? "⌘"
                : "Ctrl";

            function show(parts) {
                output.replaceChildren(
                    ...parts.map(([cls, text]) => {
                        const span = document.createElement("span");
                        span.className = cls;
                        span.textContent = text;
                        return span;
                    }),
                );
            }

            let worker;
            let running = false;
            let startTime = 0;

            function setRunning(value) {
                running = value;
                runButton.textContent = value ? "■ Stop" : "▶ Run";
                runButton.classList.toggle("stop", value);
            }

            function startWorker() {
                runButton.disabled = true;
                worker = new Worker("worker.js", { type: "module" });
                worker.onmessage = ({ data }) => {
                    if (data.type === "ready") {
                        runButton.disabled = false;
                    } else {
                        finish(data);
                    }
                };
                worker.onerror = (e) => {
                    console.error(e);
                    if (!running) {
                        // Failed while loading: restarting would just loop.
                        show([["error", "Could not start the interpreter."]]);
                        return;
                    }
                    // The wasm instance is unusable after a trap (e.g. stack overflow).
                    show([
                        [
                            "error",
                            "The interpreter crashed (out of memory or stack?).",
                        ],
                    ]);
                    setRunning(false);
                    restartWorker();
                };
            }

            function restartWorker() {
                worker.terminate();
                startWorker();
            }

            function finish(result) {
                const parts = [];
                const needsNewline =
                    result.output && !result.output.endsWith("\n");
                if (result.output) parts.push(["", result.output]);
                if (result.error) {
                    if (needsNewline) parts.push(["", "\n"]);
                    parts.push(["error", result.error]);
                } else if (result.value != null) {
                    if (needsNewline) parts.push(["", "\n"]);
                    parts.push(["value", "⇒ " + result.value]);
                } else if (!result.output) {
                    parts.push(["hint", "(no output)"]);
                }
                show(parts);
                status.textContent = `${Math.round(performance.now() - startTime)} ms`;
                setRunning(false);
            }

            function run() {
                if (runButton.disabled || running) return;
                setRunning(true);
                status.textContent = "";
                show([["hint", "Running…"]]);
                startTime = performance.now();
                worker.postMessage({ code: editor.value });
            }

            function stop() {
                show([["hint", "Stopped."]]);
                status.textContent = "";
                setRunning(false);
                restartWorker();
            }

            runButton.addEventListener("click", () => (running ? stop() : run()));

            document.addEventListener("keydown", (e) => {
                if ((isMac ? e.metaKey : e.ctrlKey) && e.key === "Enter") {
                    e.preventDefault();
                    run();
                }
            });

            // Tab inserts two spaces instead of moving focus.
            editor.addEventListener("keydown", (e) => {
                if (e.key === "Tab" && !e.shiftKey && !e.altKey) {
                    e.preventDefault();
                    editor.setRangeText(
                        "  ",
                        editor.selectionStart,
                        editor.selectionEnd,
                        "end",
                    );
                }
            });

            async function loadExamples() {
                try {
                    const res = await fetch("scripts/index.json");
                    if (!res.ok) return;
                    const names = await res.json();
                    for (const name of names) {
                        const option = document.createElement("option");
                        option.value = name;
                        option.textContent = name.replace(/-/g, " ");
                        examples.append(option);
                    }
                } catch (e) {
                    console.warn("Could not load examples", e);
                }
            }

            examples.addEventListener("change", async () => {
                const name = examples.value;
                if (!name) return;
                try {
                    const res = await fetch(`scripts/${name}.scm`);
                    if (!res.ok) throw new Error(res.statusText);
                    editor.value = (await res.text()).trim() + "\n";
                    output.replaceChildren();
                    status.textContent = "";
                } catch (e) {
                    show([["error", `Could not load example: ${e.message}`]]);
                }
            });

            loadExamples();
            startWorker();
        </script>
    </body>
</html>
